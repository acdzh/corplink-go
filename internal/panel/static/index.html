<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corplink Go</title>
<link rel="icon" href="/icon.svg">
<style>
  :root {
    color-scheme: light dark;
    --paper: light-dark(#fbf7f1, #141214);
    --raised: light-dark(#ffffff, #1e1b1e);
    --ink: light-dark(#1d1d1f, #f5f5f7);
    --muted: light-dark(#6b6b70, #a1a1a6);
    --line: light-dark(rgb(0 0 0 / 0.09), rgb(255 255 255 / 0.09));
    --hover: light-dark(rgb(0 0 0 / 0.04), rgb(255 255 255 / 0.05));
    --accent: light-dark(oklch(0.58 0.19 25), oklch(0.68 0.17 22));
    --ok: light-dark(oklch(0.62 0.16 150), oklch(0.7 0.15 150));
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 20px 64px;
    background: var(--paper); color: var(--ink);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
  }
  main { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  header { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px 6px; }
  h1 { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: .2px; }
  h2 { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
       color: var(--muted); margin: 0 0 14px; }
  .card { background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .spread { justify-content: space-between; }
  .muted { color: var(--muted); font-size: 12.5px; }
  .mono { font-family: var(--mono); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in oklab, var(--ok) 22%, transparent); }
  button {
    font: inherit; font-size: 13px; color: var(--ink); background: transparent;
    border: 1px solid var(--line); border-radius: 9px; padding: 7px 13px; cursor: pointer;
    transition: background .16s cubic-bezier(.22,1,.36,1), border-color .16s;
  }
  button:hover { background: var(--hover); }
  button.primary { background: var(--accent); border-color: transparent; color: #fff; }
  button.primary:hover { filter: brightness(1.06); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  select, input {
    font: inherit; font-size: 13px; color: var(--ink); background: var(--paper);
    border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; min-width: 0;
  }
  select:focus, input:focus { outline: 2px solid color-mix(in oklab, var(--accent) 35%, transparent); outline-offset: 1px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11.5px;
       letter-spacing: .04em; padding: 0 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 9px 6px; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: 0; }
  tr:hover td { background: var(--hover); }
  .node-name { display: flex; align-items: center; gap: 9px; }
  .node-ico { width: 20px; height: 20px; border-radius: 6px; object-fit: cover; background: var(--hover); }
  .chip { font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .metric { font-family: var(--mono); font-size: 17px; letter-spacing: -.2px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 18px; }
  label.field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
  label.field input, label.field select { width: 100%; }
  code { font-family: var(--mono); font-size: 12px; background: var(--paper); border: 1px solid var(--line);
         border-radius: 8px; padding: 8px 10px; overflow: auto; white-space: nowrap; }
  #logs { max-height: 190px; overflow: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  #logs div { padding: 3px 0; border-bottom: 1px solid var(--line); }
  #logs div:last-child { border-bottom: 0; }
  .totp { font-family: var(--mono); font-size: 26px; letter-spacing: 4px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
  @media (max-width: 720px) { .grid4 { grid-template-columns: repeat(2, 1fr); } .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Corplink Go</h1>
    <span class="muted" id="headerMode"></span>
  </header>

  <section class="card">
    <div class="row spread">
      <div class="row"><span class="dot" id="dot"></span><span id="state">未连接</span></div>
      <span class="muted" id="loginState"></span>
    </div>
    <div class="muted" id="detail" style="margin-top:10px"></div>
    <div class="row" style="margin-top:16px">
      <select id="node" style="flex:1;min-width:200px"></select>
      <button class="primary" id="btnConnect">连接</button>
      <button id="btnDisconnect">断开</button>
      <button id="btnRefresh">刷新节点</button>
    </div>
  </section>

  <section class="card">
    <h2>流量</h2>
    <div class="grid4">
      <div><div class="muted">上行</div><div class="metric" id="tx">-</div></div>
      <div><div class="muted">下行</div><div class="metric" id="rx">-</div></div>
      <div><div class="muted">上行速率</div><div class="metric" id="txRate">-</div></div>
      <div><div class="muted">下行速率</div><div class="metric" id="rxRate">-</div></div>
    </div>
    <div class="muted" id="connInfo" style="margin-top:14px"></div>
  </section>

  <section class="card">
    <div class="row spread" style="margin-bottom:12px">
      <h2 style="margin:0">节点 <span class="muted" id="nodeCount"></span></h2>
      <button id="btnLatencyAll">全部测速</button>
    </div>
    <table>
      <thead><tr><th>节点</th><th>标签</th><th>协议</th><th>延迟</th><th>内网地址</th><th></th></tr></thead>
      <tbody id="nodeTable"></tbody>
    </table>
  </section>

  <section class="card">
    <h2>设置</h2>
    <div class="grid2">
      <label class="field">代理监听<input id="setProxy" placeholder="127.0.0.1:3710"></label>
      <label class="field">面板监听<input id="setPanel" placeholder="127.0.0.1:13140"></label>
      <label class="field">SOCKS5 用户名<input id="setUser" placeholder="留空不认证"></label>
      <label class="field">SOCKS5 密码<input id="setPass" type="password"></label>
      <label class="field">自动选路间隔（秒）<input id="setAutoInterval" type="number" min="0"></label>
      <label class="field">设备型号<input id="setModel"></label>
      <label class="field">设备品牌<input id="setBrand"></label>
      <label class="field">系统 API 版本<input id="setOsVer" type="number" min="21" max="40"></label>
      <label class="field">系统补丁日期<input id="setOsPatch" placeholder="2023-07-05"></label>
      <label class="field">日志级别<select id="setLog">
        <option value="debug">debug</option><option value="info">info</option>
        <option value="warn">warn</option><option value="error">error</option>
      </select></label>
    </div>
    <div class="row" style="margin-top:16px">
      <button class="primary" id="btnSaveSettings">保存</button>
      <span class="muted" id="settingsTip"></span>
    </div>
  </section>

  <section class="card">
    <h2>登录</h2>
    <div class="row">
      <button id="btnLogin">获取授权链接</button>
      <a id="loginLink" href="#" target="_blank" class="muted" style="display:none">打开授权页 ↗</a>
      <button id="btnLogout">退出登录</button>
    </div>
    <div id="loginStep2" style="display:none;margin-top:14px">
      <input id="callback" placeholder="粘贴回调地址（corplink://... 或 device-callback 链接）" style="width:100%">
      <div class="row" style="margin-top:10px"><button id="btnCallback">提交回调</button></div>
    </div>
    <div id="loginStep3" style="display:none;margin-top:14px">
      <div class="row">
        <input id="mfaCode" placeholder="2FA 验证码（留空用 TOTP 自动填）" style="flex:1">
        <button id="btnMfa">提交</button>
      </div>
    </div>
    <div class="muted" id="loginTip" style="margin-top:12px"></div>
  </section>

  <section class="card">
    <div class="row spread">
      <h2 style="margin:0">二次验证</h2>
      <span class="muted" id="totpTip"></span>
    </div>
    <div class="totp" id="totpCode" style="margin-top:6px">------</div>
  </section>

  <section class="card">
    <h2>订阅</h2>
    <div class="row">
      <code id="subUrl" style="flex:1"></code>
      <button id="btnCopySub">复制</button>
    </div>
    <div class="muted" style="margin-top:10px">导入 Clash Verge 后保持「规则」模式，分流由配置内的规则完成。</div>
  </section>

  <section class="card">
    <h2>日志</h2>
    <div id="logs"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let nodes = [];
let selected = '';
let latency = {};
let lastSample = null;

function fmtBytes(n) {
  if (!n) return '0 B';
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0, v = n;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return v.toFixed(i === 0 ? 0 : 1) + ' ' + units[i];
}
function fmtDuration(sec) {
  if (!sec) return '-';
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return (h ? h + 'h ' : '') + (m ? m + 'm ' : '') + s + 's';
}
async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function sortedNodes() {
  if (!Object.keys(latency).length) return nodes;
  return [...nodes].sort((a, b) => {
    const la = latency[a.name], lb = latency[b.name];
    const va = la === undefined || la < 0 ? Number.MAX_SAFE_INTEGER : la;
    const vb = lb === undefined || lb < 0 ? Number.MAX_SAFE_INTEGER : lb;
    return va - vb;
  });
}
function nodeIcon(n) {
  if (n.icon) return '<img class="node-ico" src="/api/icon?u=' + encodeURIComponent(n.icon) + '" alt="" loading="lazy">';
  return '<span class="node-ico" style="display:inline-flex;align-items:center;justify-content:center">🌐</span>';
}

function renderNodes() {
  const list = sortedNodes();
  const autoMs = Object.values(latency).filter(v => v >= 0).sort((a, b) => a - b)[0];
  $('node').innerHTML = '<option value="__auto__">自动选择' + (autoMs !== undefined ? ' · ' + autoMs + 'ms' : '') + '</option>'
    + list.map(n => '<option value="' + n.name + '">' + n.name + '</option>').join('');
  $('node').value = selected === 'auto' ? '__auto__' : (selected || '');
  $('nodeCount').textContent = list.length + ' 个';
  $('nodeTable').innerHTML = list.map(n => {
    const ms = latency[n.name];
    const lat = ms === undefined ? '<span class="muted">–</span>'
      : (ms < 0 ? '<span class="muted">超时</span>' : ms + ' ms');
    const chips = [n.tag, n.type].filter(Boolean).map(c => '<span class="chip">' + c + '</span>').join(' ');
    return '<tr><td><div class="node-name">' + nodeIcon(n) + '<span>' + n.name + '</span></div></td>'
      + '<td>' + chips + '</td>'
      + '<td class="muted">' + (n.protocol_mode === 1 ? 'TCP' : 'UDP') + '</td>'
      + '<td class="mono">' + lat + '</td>'
      + '<td class="muted">' + (n.internal_ip || '') + '</td>'
      + '<td><button onclick="pickNode(\'' + n.name + '\')">选择</button></td></tr>';
  }).join('');
}
function pickNode(name) { selected = name; $('node').value = name; }

async function loadNodes() { nodes = await api('/api/nodes'); renderNodes(); }

async function refreshStatus() {
  const resp = await api('/api/status');
  const s = resp.state;
  $('dot').className = 'dot' + (s.connected ? ' on' : '');
  $('state').textContent = s.connected ? s.node : '未连接';
  $('headerMode').textContent = resp.mode === 'auto' ? '自动选择' : (resp.mode || '');
  $('loginState').textContent = resp.logged_in ? (resp.mfa_pending ? '等待二次验证' : '已登录') : '未登录';
  $('detail').textContent = resp.error
    ? resp.error
    : (s.connected ? ('隧道 ' + s.address + ' · 路由 ' + s.routes + ' 条 · DNS ' + (s.dns || []).join(', '))
                   : '未建立隧道');
  if (resp.mode === 'auto') selected = 'auto';
  else if (s.node && !selected) selected = s.node;
}

async function refreshStats() {
  const st = await api('/api/stats');
  if (!st.connected) {
    ['tx', 'rx', 'txRate', 'rxRate'].forEach(id => $(id).textContent = '-');
    $('connInfo').textContent = '';
    lastSample = null;
    return;
  }
  $('tx').textContent = fmtBytes(st.tx_bytes);
  $('rx').textContent = fmtBytes(st.rx_bytes);
  const now = Date.now();
  if (lastSample) {
    const dt = (now - lastSample.t) / 1000;
    if (dt > 0.5) {
      $('txRate').textContent = fmtBytes(Math.max(0, (st.tx_bytes - lastSample.tx) / dt)) + '/s';
      $('rxRate').textContent = fmtBytes(Math.max(0, (st.rx_bytes - lastSample.rx) / dt)) + '/s';
    }
  }
  lastSample = { t: now, tx: st.tx_bytes, rx: st.rx_bytes };
  $('connInfo').textContent = '在线 ' + fmtDuration(st.uptime_seconds)
    + (st.last_handshake ? ' · 最近握手 ' + new Date(st.last_handshake * 1000).toLocaleTimeString() : '');
}

async function connect() {
  const picked = $('node').value;
  const name = picked === '__auto__' ? 'auto' : picked;
  $('btnConnect').disabled = true;
  try {
    await api('/api/connect?node=' + encodeURIComponent(name), { method: 'POST' });
    selected = name === 'auto' ? 'auto' : name;
  } finally { $('btnConnect').disabled = false; refreshStatus(); }
}
async function disconnect() { await api('/api/disconnect', { method: 'POST' }); refreshStatus(); }
async function latencyAll() {
  $('btnLatencyAll').disabled = true;
  try { latency = await api('/api/latency/all'); renderNodes(); }
  finally { $('btnLatencyAll').disabled = false; }
}
async function refreshNodes() { await api('/api/refresh', { method: 'POST' }); await loadNodes(); }

async function refreshTotp() {
  try {
    const t = await api('/api/totp');
    $('totpCode').textContent = t.has_secret ? t.code : '------';
    $('totpTip').textContent = t.has_secret ? t.remaining + 's' : '未绑定';
  } catch (e) { $('totpTip').textContent = '读取失败'; }
}

async function refreshLogs() {
  const list = await api('/api/logs');
  $('logs').innerHTML = list.slice().reverse().map(e =>
    '<div><span style="opacity:.7">' + e.time + '</span>  ' + e.message + '</div>').join('') || '<div>暂无事件</div>';
}

async function loadSettings() {
  const s = await api('/api/settings');
  $('setProxy').value = s.proxy_listen || '';
  $('setPanel').value = s.panel_listen || '';
  $('setUser').value = s.socks5_username || '';
  $('setPass').value = s.socks5_password || '';
  $('setAutoInterval').value = s.auto_mode_interval_seconds || 300;
  $('setLog').value = s.log_level || 'info';
  $('setModel').value = s.device_model || '';
  $('setBrand').value = s.device_brand || '';
  $('setOsVer').value = s.os_version || '';
  $('setOsPatch').value = s.os_version_patch || '';
}
async function saveSettings() {
  const r = await api('/api/settings', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      proxy_listen: $('setProxy').value.trim(),
      panel_listen: $('setPanel').value.trim(),
      socks5_username: $('setUser').value.trim(),
      socks5_password: $('setPass').value,
      auto_mode_interval_seconds: parseInt($('setAutoInterval').value || '300', 10),
      log_level: $('setLog').value,
      device_model: $('setModel').value.trim(),
      device_brand: $('setBrand').value.trim(),
      os_version: $('setOsVer').value.trim(),
      os_version_patch: $('setOsPatch').value.trim(),
    }),
  });
  $('settingsTip').textContent = r.restart_required && r.restart_required.length
    ? '已保存，重启生效：' + r.restart_required.join('、')
    : '已保存';
}

async function loadSub() { const r = await api('/api/sub'); $('subUrl').textContent = r.url; }

async function startLogin() {
  const r = await api('/api/login/start', { method: 'POST' });
  const link = $('loginLink');
  link.href = r.url; link.style.display = 'inline';
  $('loginStep2').style.display = 'block';
  $('loginTip').textContent = '完成授权后把回调地址粘回来';
}
async function submitCallback() {
  const callback = $('callback').value.trim();
  if (!callback) return;
  try {
    const r = await api('/api/login/callback', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ callback }),
    });
    if (r.mfa_required) {
      $('loginStep3').style.display = 'block';
      $('loginTip').textContent = '需要二次验证码';
      return;
    }
    $('loginTip').textContent = '登录成功，节点 ' + (r.nodes || 0) + ' 个';
    $('loginStep2').style.display = 'none';
    loadNodes(); refreshStatus();
  } catch (e) { $('loginTip').textContent = e.message; }
}
async function submitMfa() {
  try {
    const r = await api('/api/login/mfa', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: $('mfaCode').value.trim() }),
    });
    $('loginTip').textContent = '登录成功，节点 ' + (r.nodes || 0) + ' 个';
    $('loginStep3').style.display = 'none';
    loadNodes(); refreshStatus();
  } catch (e) { $('loginTip').textContent = e.message; }
}
async function logout() { await api('/api/logout', { method: 'POST' }); $('loginTip').textContent = '已退出登录'; loadNodes(); refreshStatus(); }

$('btnConnect').onclick = connect;
$('btnDisconnect').onclick = disconnect;
$('btnRefresh').onclick = refreshNodes;
$('btnLatencyAll').onclick = latencyAll;
$('btnSaveSettings').onclick = saveSettings;
$('btnCopySub').onclick = () => navigator.clipboard.writeText($('subUrl').textContent);
$('btnLogin').onclick = startLogin;
$('btnCallback').onclick = submitCallback;
$('btnMfa').onclick = submitMfa;
$('btnLogout').onclick = logout;
$('node').onchange = (e) => { selected = e.target.value === '__auto__' ? 'auto' : e.target.value; };

loadNodes(); loadSettings(); loadSub(); refreshStatus(); refreshStats(); refreshTotp(); refreshLogs();
setInterval(refreshStatus, 3000);
setInterval(refreshStats, 2000);
setInterval(refreshTotp, 1000);
setInterval(refreshLogs, 4000);
</script>
</body>
</html>
