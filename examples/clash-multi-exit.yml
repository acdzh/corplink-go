# 多出口示例：公司 CN 节点走内网分流，Antigravity 走日本节点
#
# 前提：
#   1. 实例 A（公司 CN）：corplink serve -proxy 127.0.0.1:3710 -panel 127.0.0.1:13140
#   2. 实例 B（日本节点）：起第二个实例，端口错开并在启动时连 JP 节点：
#      corplink serve -config ~/.corplink-go/config-jp.json \
#        -proxy 127.0.0.1:3711 -panel 127.0.0.1:13141 -name JP-1
#      （若公司没有日本节点，可换成机场订阅的 JP 节点，见文件末尾注释）
#
# 规则顺序：公司内网 > Antigravity > 其他直连

proxies:
  - name: "CorpLink-CN"
    type: socks5
    server: 127.0.0.1
    port: 3710
    udp: true
  - name: "CorpLink-JP"
    type: socks5
    server: 127.0.0.1
    port: 3711
    udp: true

proxy-groups:
  - name: "公司内网"
    type: select
    proxies: ["CorpLink-CN", DIRECT]
  - name: "Antigravity"
    type: select
    proxies: ["CorpLink-JP", "CorpLink-CN", DIRECT]

dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5
    - 119.29.29.29

rules:
  # 0. 防回环：控制面域名 + 全部节点 IP 直连。
  #    真实订阅会自动生成这些行（例如下面两条），手写配置时务必补齐：
  #      - DOMAIN-SUFFIX,sealsuite.example.com,DIRECT
  #      - IP-CIDR,58.246.92.105/32,DIRECT,no-resolve
  # 1. 公司内网：把 /clash.yml 里服务端下发的 IP-CIDR / DOMAIN-SUFFIX 整段复制过来，
  #    目标改成「公司内网」。这里是示意，实际请用订阅生成的内容。
  - IP-CIDR,10.8.8.18/32,公司内网,no-resolve
  - DOMAIN-SUFFIX,bytedance.net,公司内网

  # 2. Antigravity / Gemini 系：全部走日本出口
  - DOMAIN-SUFFIX,antigravity.google,Antigravity
  - DOMAIN-SUFFIX,gemini.google.com,Antigravity
  - DOMAIN-SUFFIX,cloudcode-pa.googleapis.com,Antigravity
  - DOMAIN-SUFFIX,generativelanguage.googleapis.com,Antigravity
  - DOMAIN-SUFFIX,googleapis.com,Antigravity
  - DOMAIN-SUFFIX,gstatic.com,Antigravity
  - DOMAIN-SUFFIX,googleusercontent.com,Antigravity
  - DOMAIN-SUFFIX,accounts.google.com,Antigravity

  # 3. 其余直连
  - MATCH,DIRECT

# 若日本节点来自机场订阅：把机场订阅里的 JP 节点并入 proxies，
# 再把「Antigravity」组的第一项换成该节点名即可，其余规则不变。
