name: release

on:
  # 手动点一下发版：版本号按日期自动生成，不用手写。
  workflow_dispatch:
  # 也可以自己打 tag 触发（v2026.11.21 这种）。
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  version:
    name: 计算版本（日期）
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: ver
        name: 生成日期 tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/}"
            echo "使用已有 tag：$v"
          else
            base=$(TZ=Asia/Shanghai date +%Y.%m.%d)
            v="v$base"
            n=1
            # 同一天第二次发版用 -N 后缀：goreleaser 只认三段式 semver，
            # v2026.11.22.2 这种四段 tag 会被判非法。
            while git ls-remote --exit-code --tags origin "$v" >/dev/null 2>&1; do
              n=$((n+1))
              v="v$base-$n"
            done
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$v"
            git push origin "$v"
            echo "新建 tag：$v"
          fi
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"

  binaries:
    name: 打包并发布
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: 拉取刚创建的 tag
        run: git fetch --force --tags
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: 镜像（amd64 + arm64）
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/corplink-go
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
  android:
    name: Android APK
    needs: [version, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # 默认会去装 "tools" 包，新版 cmdline-tools 里已经没有了，自己装需要的。
          packages: ''
      - name: 安装 SDK 组件与 NDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: 准备 gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
      - name: 生成 AAR
        run: gomobile bind -target=android -androidapi 24 -o apps/android/app/libs/corplink.aar ./apps/android/bind
      - name: 构建 APK
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug -PcorplinkVersion=${{ needs.version.outputs.version }}
      - name: 附加到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="corplink-go_${{ needs.version.outputs.version }}_android.apk"
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk "$name"
          gh release upload "v${{ needs.version.outputs.version }}" "$name" --clobber

  desktop-app:
    name: 桌面端 .app
    needs: [version, binaries]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: 构建并打包 .app
        env:
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags "-s -w" -o corplink-desktop ./apps/desktop
          VERSION=${{ needs.version.outputs.version }} scripts/macos-app.sh corplink-desktop "Corplink Go.app"
          ditto -c -k --sequesterRsrc --keepParent "Corplink Go.app" "corplink-go-desktop_${{ needs.version.outputs.version }}_darwin_app.zip"
      - name: 附加到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          zip="corplink-go-desktop_${{ needs.version.outputs.version }}_darwin_app.zip"
          gh release upload "v${{ needs.version.outputs.version }}" "$zip" --clobber
