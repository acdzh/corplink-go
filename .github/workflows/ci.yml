name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build
        run: go build ./...
      - name: 库不能依赖 HTTP 层与端侧
        run: |
          leaked=$(go list -deps ./corplink/... | grep -E 'corplink-go/(httpapi|apps)' || true)
          if [ -n "$leaked" ]; then
            echo "库出现了反向依赖："
            echo "$leaked"
            exit 1
          fi

  cross:
    name: cross ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: 库与 CLI
        run: go build ./corplink/... ./apps/cli
      - name: 桌面端
        run: go build ./apps/desktop
      - name: Android 绑定层（Go 侧）
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: GOOS=android GOARCH=arm64 go build ./apps/android/bind

  desktop-macos:
    name: desktop macOS 原生构建
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: 构建可执行文件
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -o dist/corplink-desktop ./apps/desktop
          file dist/corplink-desktop
      - name: 包成 .app 并校验
        run: |
          scripts/macos-app.sh dist/corplink-desktop "dist/Corplink Go.app"
          plutil -lint "dist/Corplink Go.app/Contents/Info.plist"
          test -x "dist/Corplink Go.app/Contents/MacOS/Corplink Go"

  docker:
    name: docker 多架构构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: 构建镜像（不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
